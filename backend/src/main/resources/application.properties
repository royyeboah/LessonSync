# Google OAuth 2.0 client (create a "Web application" client in the Google Cloud console).
# Prefer setting these via environment variables; alternatively place the downloaded
# credentials.json in src/main/resources (it is gitignored).
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}

# Must be registered as an authorized redirect URI on the OAuth client.
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/auth/google/callback}

# Where refresh/access tokens are persisted (gitignored).
google.oauth.tokens-directory=${GOOGLE_OAUTH_TOKENS_DIRECTORY:tokens}

# Where users are sent back to after the Google consent screen.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
