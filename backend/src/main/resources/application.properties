server.port=8080

# Google OAuth 2.0 — create a Web application client in Google Cloud Console:
#   APIs & Services > Credentials > Create credentials > OAuth client ID > Web application
# Authorized JavaScript origins:
#   http://localhost:4200
#   http://localhost:8080
# Authorized redirect URIs:
#   http://localhost:8080/login/oauth2/code/google
#
# Then set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET (do not commit real secrets).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/calendar
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Long enough for a student to upload a timetable and confirm events
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
